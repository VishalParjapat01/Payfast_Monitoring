name: Payment gateway monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-payment-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check monitor secrets
        shell: bash
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          for variable in USER_EMAIL USER_PASSWORD SMTP_HOST SMTP_USER SMTP_PASSWORD ALERT_FROM ALERT_TO; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .payment-monitor-state.json
          key: payment-monitor-state-${{ github.run_id }}
          restore-keys: payment-monitor-state-
      - run: xvfb-run --auto-servernum npm run monitor:payment
        env:
          HEADLESS: 'false'
          BASE_URL: https://mindmatters-summit.com
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .payment-monitor-state.json
          key: payment-monitor-state-${{ github.run_id }}